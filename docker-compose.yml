services:
  app:
    build:
      context: .
      args:
        # Baked into the build (sitemap + absolute OG image URLs), not read at
        # runtime. Phase 1 serves plain HTTP on the LAN, so it defaults to the
        # host:port below. When DNS and the reverse proxy land, set SITE_URL to
        # the real origin in .env and REBUILD — restarting is not enough.
        SITE_URL: ${SITE_URL:-http://203.0.113.10:8587}
    image: ainaidee:latest
    restart: unless-stopped
    environment:
      # Only needed for the /api/runai/metrics endpoint. Everything else on the
      # site works without them; the endpoint throws if they are unset.
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
    # Not published to the host: Caddy below now owns :8587 and is Imperva's
    # configured origin for ainaidee.com/www/blog. app is reached only as
    # app:4321 over the compose network.
    networks:
      - web

  # Blog (Ghost) — running behind `docker compose --profile blog up -d`.
  # Admin (/ghost*) is deliberately NOT proxied by Caddy and NOT published on
  # the public interface: the port binding below is 127.0.0.1-only, reached by
  # SSH tunnel (`ssh -L 2368:localhost:2368 deploy@203.0.113.10`, then open
  # http://localhost:2368/ghost locally) to create the owner account and any
  # Content API key. This avoids the race where a public, unprotected /ghost
  # lets someone else claim the owner account before you do. See
  # docs/blog-plan.md for the full plan and docs/blog-architecture.md for the
  # Caddy routing this pairs with (blog.ainaidee.com -> app:4321, /blog{uri}).
  #
  # MySQL, not SQLite (decided 2026-07-31, revised same day): SQLite is
  # development-only in Ghost's official Docker image, and this server already
  # runs one other project's Postgres container on 5432 — Ghost can't use it
  # anyway (no Postgres adapter) and sharing another project's database would
  # be its own bad idea even if it could. A dedicated ghost-db below is the
  # official, fully-supported path and stays isolated from every other
  # container on this shared box.
  ghost:
    image: ghost:6-alpine
    profiles: ["blog"]
    restart: unless-stopped
    depends_on:
      - ghost-db
    environment:
      url: ${GHOST_URL:-https://blog.ainaidee.com}
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ghost
      # No default on purpose — MySQL_PASSWORD below must match. Both must be
      # set in .env on the server before this profile is ever started; do not
      # paste real values into chat.
      database__connection__password: ${GHOST_DB_PASSWORD:?set GHOST_DB_PASSWORD in .env before using the blog profile}
      database__connection__database: ghost
    ports:
      - "127.0.0.1:2368:2368"
    volumes:
      - ghost_content:/var/lib/ghost/content
    networks:
      - web

  ghost-db:
    image: mysql:8.0
    profiles: ["blog"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ghost
      MYSQL_USER: ghost
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD:?set GHOST_DB_PASSWORD in .env before using the blog profile}
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
    volumes:
      - ghost_db_data:/var/lib/mysql
    networks:
      - web

  # ainaidee.com sits behind Imperva Incapsula (CWAF) — confirmed 2026-08-01.
  # Imperva terminates TLS and reverse-proxies to this origin over plain HTTP
  # at :8587 for every hostname (ainaidee.com, www.ainaidee.com,
  # blog.ainaidee.com all point at the same origin:port in Imperva's
  # dashboard). Caddy's only job is Host-based routing on that one port —
  # NOT certificates (`auto_https off` in the Caddyfile; a same-box Let's
  # Encrypt/ZeroSSL ACME challenge can never reach this container, since
  # Imperva's edge answers every request to these hostnames first) — mainly
  # so blog.ainaidee.com's traffic gets the /blog{uri} rewrite that
  # src/pages/blog/* needs while ainaidee.com/www pass straight through
  # unchanged. See Caddyfile and docs/blog-architecture.md.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-8587}:8587"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web

networks:
  web:

volumes:
  caddy_data:
  caddy_config:
  ghost_content:
  ghost_db_data:
